[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sparc-uq"
version = "0.1.0"
description = "Feature-leverage scaling and split conformal intervals for frozen point estimators"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]
authors = [
  {name = "Sakif Hossain"},
  {name = "Julian Teusch"},
  {name = "J\u00f6rg P. M\u00fcller"},
]
keywords = ["uncertainty-quantification", "conformal-prediction", "pytorch", "motion-forecasting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build"]
release = ["build>=1.2", "twine>=6"]
visualization = ["matplotlib>=3.7"]
notebook = ["matplotlib>=3.7", "jupyterlab>=4", "ipykernel>=6", "nbformat>=5.9", "nbclient>=0.8", "jupytext>=1.16"]

[project.urls]
Paper = "https://arxiv.org/abs/2608.20802"
Project = "https://julianteusch.github.io/projects/sparc/"
Source = "https://github.com/julianteusch/sparc-uq"
Issues = "https://github.com/julianteusch/sparc-uq/issues"
Notebook = "https://github.com/julianteusch/sparc-uq/blob/main/notebooks/01_forecasts_and_diagnostics.ipynb"
Changelog = "https://github.com/julianteusch/sparc-uq/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
